name: CI

env:
  ANALYZE: true

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - synchronize
  workflow_dispatch:

jobs:
  build:
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      - name: 🛒 Checkout Repo
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: ⚒️ Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install Dependencies
        run: npm run bootstrap

      - name: Install Playwright System Dependencies
        run: pnpm --filter ./example exec playwright install-deps

      - name: Build Library
        run: pnpm --filter ./lib build

      - name: Lint
        run: pnpm lint --reporter=github

      - name: Run Tests
        run: |
          pnpm run test:coverage
          echo '### Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat example/coverage/coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Check Package
        run: pnpm --filter ./lib run check

      - name: 🧊 SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=nerdyman
            -Dsonar.projectKey=nerdyman_react-image-turntable
            -Dsonar.sources=lib/src
            -Dsonar.inclusions=**/*.js,**/*.jsx,**/*.ts,**/*.tsx,**/*.yml,**/*.yaml
            -Dsonar.javascript.lcov.reportPaths=example/coverage/lcov.info

      - name: Analyze esbuild bundle size
        uses: exoego/esbuild-bundle-analyzer@v1
        with:
          metafiles: "lib/dist/metafile-esm.json"
